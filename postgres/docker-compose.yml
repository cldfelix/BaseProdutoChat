services:
  postgres:
    build: .
    container_name: postgres_gis_vector_timescale
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /home/postgres/pgdata/data
    ports:
      - '${POSTGRES_PORT}:5432'
    shm_size: 1g
    volumes:
      - postgres_ha_data:/home/postgres/pgdata/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - db-postgres

volumes:
  postgres_ha_data:

networks:
  db-postgres:
    driver: bridge
